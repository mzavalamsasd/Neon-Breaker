<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Breaker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="game-stage">
      <canvas id="game" width="600" height="450" aria-label="Neon Breaker game"></canvas>
      <section class="home-screen" id="home-screen" aria-label="Neon Breaker menu">
        <div class="home-content">
          <div id="home-panel">
            <p class="home-kicker">ARCADE SYSTEM / 01</p>
            <h1 id="game-title"><span>NEON</span><span class="title-accent">BREAKER</span></h1>
            <p class="home-subtitle">Clear the grid. Keep the ball alive.</p>
          </div>
          <div class="game-over-panel" id="game-over-panel" hidden>
            <p class="home-kicker">RUN COMPLETE</p>
            <h1 id="game-over-title"><span>GAME</span><span class="title-accent">OVER</span></h1>
            <div class="run-stats" aria-label="Run statistics">
              <div class="run-stat"><span>High score</span><strong id="high-score-result">0</strong></div>
              <div class="run-stat"><span>Run score</span><strong id="run-score-result">0</strong></div>
              <div class="run-stat"><span>Bricks broken</span><strong id="bricks-broken-result">0</strong></div>
              <div class="run-stat"><span>Time played</span><strong id="run-time-result">0:00</strong></div>
              <div class="run-stat"><span>Lives used</span><strong id="lives-used-result">0</strong></div>
            </div>
          </div>
          <div class="settings-bar" role="group" aria-label="Game settings">
            <label class="setting-control">
              <span class="setting-heading">Ball speed <output id="ball-speed-value" for="ball-speed">4</output></span>
              <input id="ball-speed" type="range" min="2" max="8" step="1" value="4">
            </label>
            <label class="setting-control">
              <span class="setting-heading">Paddle speed <output id="paddle-speed-value" for="paddle-speed">6</output></span>
              <input id="paddle-speed" type="range" min="3" max="10" step="1" value="6">
            </label>
            <label class="setting-control">
              <span class="setting-heading">Canvas size</span>
              <select id="canvas-size">
                <option value="compact">Compact</option>
                <option value="standard" selected>Standard</option>
                <option value="wide">Wide</option>
              </select>
            </label>
          </div>
          <button class="play-button" id="start-button" type="button">Start game</button>
          <button class="play-button" id="play-again-button" type="button" hidden>Play again</button>
          <div class="controls-legend" role="group" aria-label="Move the paddle with the arrow keys or A and D">
            <div class="key-group" aria-hidden="true">
              <kbd>←</kbd><kbd>→</kbd><span>or</span><kbd>A</kbd><kbd>D</kbd>
            </div>
            <span class="control-label">Move paddle</span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- The order matters: game.js goes first because the other files use its settings. -->
  <script src="game.js"></script>
  <script src="bricks.js"></script>
  <script src="collisions.js"></script>
</body>
</html>
